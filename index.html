/* Layout: one narrow column for the parent (today / boxes / timer / help) + a full-screen card stage for Luca.
   Box colours follow LEGO brick colours, 1 = red … 5 = blue, mastered = purple. */
:root {
  --bg: #edf2f6; --surface: #ffffff; --sunk: #e3eaf0; --ink: #1c2833; --muted: #5a6876; --line: #d3dce4;
  --accent: #2563c9; --accent-ink: #ffffff; --good: #1f8f5a; --bad: #c2413b;
  --b1: #d7383e; --b2: #e9822a; --b3: #d9a900; --b4: #2a9a62; --b5: #2563c9; --bm: #7651cf; --bq: #8794a1;
  --card: Andika, "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  --ui: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11181f; --surface: #1a232d; --sunk: #222d38; --ink: #e7edf3; --muted: #9ba9b6; --line: #2c3946;
  --accent: #5b92ec; --accent-ink: #0d1520; --good: #3fbf82; --bad: #ec6b65;
  --b1: #ec5a5f; --b2: #f39b4c; --b3: #e8c22e; --b4: #3fbf82; --b5: #5b92ec; --bm: #9b7cf0; --bq: #7e8b98; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11181f; --surface: #1a232d; --sunk: #222d38; --ink: #e7edf3; --muted: #9ba9b6; --line: #2c3946;
  --accent: #5b92ec; --accent-ink: #0d1520; --good: #3fbf82; --bad: #ec6b65;
  --b1: #ec5a5f; --b2: #f39b4c; --b3: #e8c22e; --b4: #3fbf82; --b5: #5b92ec; --bm: #9b7cf0; --bq: #7e8b98; color-scheme: dark }
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100% }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
input, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.wrap { max-width: 760px; margin: 0 auto; padding-block: 18px 110px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font-size: 13px; color: var(--muted); letter-spacing: .04em; }
h1 { font-size: 28px; margin: 2px 0 0; text-wrap: balance; }
h2 { font-size: 17px; margin: 0; }
p { margin: 0; }
.small { font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }
.kv { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; background: var(--sunk); border-radius: 12px; min-width: 0; }
.kv b { font-size: 18px; font-family: var(--card); }
.btn { padding: 14px 18px; border-radius: 14px; font-weight: 700; font-size: 17px; background: var(--sunk); text-align: center; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); color: #fff; }
.btn.bad { background: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); font-weight: 500; }
.btn.wide { width: 100%; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; background: var(--sunk); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.warn { background: color-mix(in srgb, var(--b2) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--b2) 50%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.note { font-size: 13px; color: var(--muted); text-align: center; }
/* box tabs */
.boxes { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
@media (max-width: 560px) { .boxes { grid-template-columns: repeat(4, 1fr); } }
.boxtab { border-radius: 12px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 0; background: var(--sunk); border: 2px solid transparent; }
.boxtab .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.boxtab .l { font-size: 12px; color: var(--muted); }
.boxtab.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 14%, var(--surface)); }
.boxtab .bar { width: 26px; height: 6px; border-radius: 3px; background: var(--c); }
.cards { display: flex; flex-wrap: wrap; gap: 8px; }
.wc { font-family: var(--card); font-size: 20px; padding: 6px 14px; border-radius: 10px; background: var(--sunk); border-left: 5px solid var(--c, var(--bq)); }
/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.tabs .in { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; max-width: 760px; }
.tabs button { padding: 8px 4px; border-radius: 10px; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.tabs button .ic { font-size: 20px; line-height: 1; }
.tabs button.on { color: var(--accent); font-weight: 700; }

.stage { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 12px; }
.stage .top { display: flex; justify-content: space-between; align-items: center; gap: 10px; max-width: 900px; width: 100%; margin: 0 auto; }
.prog { flex: 1; height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.big { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; min-height: 0; text-align: center; }
.flash { font-family: var(--card); font-size: clamp(88px, min(26vw, 38vh), 400px); line-height: 1.05; background: var(--surface); border-radius: 28px; padding: .18em .5em; border: 1px solid var(--line);
  box-shadow: 0 8px 0 var(--c, var(--line)); min-width: 3.2em; }
.flash.sm { font-size: clamp(56px, min(15vw, 24vh), 260px); }
.hint { font-size: 18px; color: var(--muted); max-width: 34em; }
.hint b { color: var(--ink); }
.stage .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 900px; width: 100%; margin: 0 auto; }
.stage .acts.one { grid-template-columns: 1fr; }
.stage .acts .btn { padding: 22px 12px; font-size: 20px; }
.parent { font-size: 14px; color: var(--muted); text-align: center; }
.say { font-size: 16px; padding: 6px 14px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink); font-weight: 500; }
.pword { font-family: var(--card); font-size: 44px; line-height: 1.2; padding: 4px 20px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); border-bottom: 5px solid var(--c, var(--line)); display: inline-block; }
.wc.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
.place { padding: 12px 16px; border-radius: 14px; background: color-mix(in srgb, var(--c) 18%, var(--surface)); border: 2px solid var(--c); font-size: 19px; font-weight: 700; text-align: center; max-width: 900px; width: 100%; margin: 0 auto; }
.place .small { font-weight: 400; }
.scroll { overflow: auto; flex: 1; max-width: 900px; width: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.tag { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.checks { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 560px; }
.check { display: flex; gap: 12px; align-items: center; text-align: left; padding: 14px 16px; border-radius: 14px; background: var(--surface); border: 2px solid var(--line); font-size: 17px; }
.check .bx { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-weight: 700; }
.check.on { border-color: var(--good); }
.check.on .bx { background: var(--good); border-color: var(--good); color: #fff; }
.steps { display: flex; gap: 6px; justify-content: center; }
.steps span { width: 34px; height: 6px; border-radius: 3px; background: var(--sunk); }
.steps span.on { background: var(--accent); }
.pick { display: flex; flex-wrap: wrap; gap: 8px; }
.pick button { font-family: var(--card); font-size: 22px; padding: 6px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.timer { font-family: var(--card); font-size: clamp(64px, 18vw, 120px); font-variant-numeric: tabular-nums; text-align: center; line-height: 1; padding-block: 8px; }
table.rec { width: 100%; border-collapse: collapse; font-size: 15px; font-variant-numeric: tabular-nums; }
table.rec td, table.rec th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
table.rec th { font-weight: 500; color: var(--muted); font-size: 13px; }
.sheet { position: fixed; inset: 0; z-index: 30; background: color-mix(in srgb, var(--ink) 40%, transparent); display: flex; align-items: flex-end; justify-content: center; }
.sheet .in { background: var(--surface); width: 100%; max-width: 620px; border-radius: 20px 20px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow: auto; }
.movers { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.movers button { padding: 10px 0; border-radius: 10px; font-weight: 700; background: var(--sunk); border-bottom: 4px solid var(--c); }
.movers button.on { background: var(--c); color: #fff; }
.help li { margin-bottom: 6px; }
.help ol, .help ul { margin: 0; padding-left: 1.3em; }
.sync { font-size: 12px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
@keyframes pop { from { transform: scale(.92); } to { transform: scale(1); } }
.flash { animation: pop .18s ease-out; }
</style>

function counts() { const c = {}; BOXES.forEach(b => c[b] = 0); Object.keys(CAT).forEach(id => c[boxOf(id)]++); return c; }
function dueList(boxes, ignoreDate) {
  const t = dstr(today());
  const ids = Object.keys(state.cards).filter(id => CAT[id] && boxes.includes(st(id).b) && (ignoreDate || st(id).d !== t));
  return boxes.flatMap(b => shuffle(ids.filter(id => st(id).b === b)));
}
function weekInfo() { const w = Math.min(48, Math.max(1, weekNo(today()))); return { w, cur: DATA.weeks[w - 1], next: DATA.weeks[w] }; }

// timer
let tStart = 0, tElapsed = 0, tRun = false, tRAF = 0, lastSaved = null;
function curSec() { return (tElapsed + (tRun ? performance.now() - tStart : 0)) / 1000; }
function tickTimer() { const el = $('#tdisp'); if (!el) return; const s = curSec(); el.textContent = `${Math.floor(s / 60)}:${pad(Math.floor(s % 60))}.${Math.floor(s * 10) % 10}`; if (tRun) tRAF = requestAnimationFrame(tickTimer); }
function vTimer() {
  const labels = [...new Set(state.timer.map(r => r.label))];
  const best = {}; state.timer.forEach(r => { if (best[r.label] == null || r.sec < best[r.label]) best[r.label] = r.sec; });
  const recent = state.timer.slice(-14).reverse();
  return `
  <header><div class="eyebrow">老师的流利度表：每天读一遍，和自己比</div><h1>计时</h1><div class="sync" id="sync"></div></header>
  <section class="panel">
    <div class="row"><input id="tlabel" list="tlabels" value="${esc(labels[labels.length - 1] || '流利度表 1')}" aria-label="读的是哪张表" style="flex:1">
      <datalist id="tlabels">${labels.map(l => `<option value="${esc(l)}">`).join('')}</datalist></div>
    <div class="timer" id="tdisp">0:00.0</div>
    <div class="grid2">
      <button class="btn ${tRun ? 'bad' : 'good'}" data-act="tgo">${tRun ? '停' : (tElapsed ? '继续' : '开始')}</button>
      ${!tRun && tElapsed ? '<button class="btn primary" data-act="tsave">记下这次</button>' : '<button class="btn" data-act="treset">清零</button>'}
    </div>
    ${lastSaved ? `<div class="warn" style="text-align:center;font-size:17px">${lastSaved}</div>` : ''}
    ${!tRun && tElapsed ? '<button class="btn ghost" data-act="treset">不记，清零</button>' : ''}
  </section>
  <section class="panel">
    <h2>记录</h2>
    ${labels.length ? `<div class="row">${labels.map(l => `<span class="chip">★ ${esc(l)} 最好 ${fmt(best[l])}</span>`).join('')}</div>` : ''}
    ${recent.length ? `<div style="overflow-x:auto"><table class="rec"><tr><th>日期</th><th>表</th><th>用时</th></tr>${recent.map(r => `<tr><td>${esc(r.d.slice(5))}</td><td>${esc(r.label)}</td><td>${fmt(r.sec)}${r.sec === best[r.label] ? ' ★' : ''}</td></tr>`).join('')}</table></div>` : '<p class="small">还没有记录。读完一遍按「停」，再按「记下这次」。</p>'}
  </section>`;
}

    <div style="text-align:center"><span class="flash sm" style="--c:${COLOR[b]};display:inline-block">${esc(c.text)}</span></div>
    ${cardHint(c)}
    <div class="row" style="justify-content:center">${sayBtn(id)}${sayBtn(id, 'sent')}</div>
    <h2>放进哪一盒</h2>
    <div class="movers">${BOXES.map(x => `<button style="--c:${COLOR[x]}" class="${x === b ? 'on' : ''}" data-act="move" data-id="${esc(id)}" data-b="${x}" ${x === 'm' && !(s.s && s.u) ? 'disabled title="要先过「说出来」和「用出来」"' : ''}>${x === 'm' ? '✓' : x === 'q' ? '?' : x}</button>`).join('')}</div>
    <p class="small">「已掌握」要先勾上「说出来」和「用出来」。</p>
    <h2>四关</h2>
    <div class="checks">${lv.map(([k, n, d, on]) => `<button class="check ${on ? 'on' : ''}" ${k === 'ok' ? 'disabled' : `data-act="lv" data-id="${esc(id)}" data-k="${k}"`}><span class="bx">${on ? '✓' : ''}</span><span><b>${n}</b><br><span class="small">${d}${k === 'ok' ? '（4 号盒以上自动算）' : ''}</span></span></button>`).join('')}</div>
  </div>`;

function sayBtn(id, what) {
  const c = CAT[id];
  if (!CAN_SAY || !c || (what === 'sent' && c.kind === 'L')) return '';
  const label = what === 'sent' ? '🔊 读例句' : c.kind === 'L' ? `🔊 ${esc(c.kw)}` : '🔊 读一遍';
  return `<button class="say" data-act="say" data-id="${esc(id)}" data-w="${what || 'word'}" aria-label="读出来">${label}</button>`;
}
function cardHint(c) {
  if (c.kind === 'L') return `<p class="hint" style="margin:0 auto">${c.e} <b>${esc(c.kw)}</b> ${esc(c.snd)}　说音，不说字母名</p>`;
  const h = HEART[c.text];
  if (h) return `<p class="hint" style="margin:0 auto">❤ ${esc(h)}</p>`;
  if (c.mark === '拼' || c.kind === 'W') return `<p class="hint" style="margin:0 auto">能拼的词：指着字母一个个说音，再连起来读${c.e ? ' ' + c.e : ''}</p>`;
  return '';
}
$('#sheet').addEventListener('click', e => { if (e.target === $('#sheet')) closeSheet(); });
function closeSheet() { $('#sheet').hidden = true; render(); }

// ---------- stage (sessions) ----------
let S = null;
function openStage() { $('#stage').hidden = false; document.body.style.overflow = 'hidden'; }
function closeStage() { S = null; $('#stage').hidden = true; document.body.style.overflow = ''; render(); }
function flashHTML(id, extra = '') {
  const c = CAT[id];
  if (PAPER) return `<p class="parent">举起这张纸卡（在${BOXNAME[boxOf(id)]}）</p><div class="pword" style="--c:${COLOR[boxOf(id)]}">${esc(c.text)}</div>${extra}`;
  return `<div class="flash ${c.text.length > 5 ? 'sm' : ''}" style="--c:${COLOR[boxOf(id)]}">${esc(c.text)}</div>${extra}`;
}
function top(label, frac) { return `<div class="top"><button class="btn ghost" data-act="stop">停</button><div class="prog"><i style="width:${Math.round(frac * 100)}%"></i></div><span class="small">${label}</span></div>`; }

// review
function startReview(ids, title) {
  if (!ids.length) return;
  S = { mode: 'review', ids, i: 0, ok: 0, bad: 0, phase: 'card', title, paper: PAPER, done: {}, sel: null, msg: null, orig: {} };
  ids.forEach(id => S.orig[id] = boxOf(id));
  openStage(); drawStage();
}
const curId = () => S.paper ? S.sel : S.ids[S.i];
const byText = (a, b) => CAT[a].text.toLowerCase().localeCompare(CAT[b].text.toLowerCase());
function placeMsg() {
  const m = S.msg; if (!m) return '';
  const c = CAT[m.id], dest = m.dest;
  const where = dest === 'q' ? '留在待学袋' : dest === 'm' ? '放进 ✓ 已掌握袋' : dest === '1' && m.bad ? '放回 1 号盒' : `放进 ${BOXNAME[dest]}`;
  return `<div class="place" style="--c:${COLOR[dest]}">${esc(c.text)} → ${where}${m.bad ? `<br><span class="small">你读一遍，他跟读。</span> ${sayBtn(m.id)}` : ''}</div>`;
}
function paperGrid(act) {
  const left = S.ids.filter(id => !S.done[id]);
  const groups = [...new Set(left.map(id => S.orig[id]))].sort((a, b) => BOXES.indexOf(a) - BOXES.indexOf(b));
  return groups.map(b => { const l = left.filter(id => S.orig[id] === b).sort(byText);
    return `<div><h2 style="margin-bottom:8px">${BOXNAME[b]}（${l.length}）</h2><div class="cards">${l.map(id => `<button class="wc ${S.sel === id ? 'sel' : ''}" style="--c:${COLOR[b]}" data-act="${act}" data-id="${esc(id)}">${esc(CAT[id].text)}</button>`).join('')}</div></div>`; }).join('');
}
function paperDone(id, dest, bad) { S.done[id] = 1; S.i = Object.keys(S.done).length; S.msg = { id, dest, bad }; S.sel = null; S.phase = 'card'; if (S.i >= S.ids.length) return finish(); drawStage(); }
function drawReviewPaper() {
  const n = S.ids.length, d = Object.keys(S.done).length;
  const sel = S.sel;
  return top(`${d} / ${n}`, d / n) + placeMsg() +
    `<div class="scroll"><p class="small">从信封里拿出一张纸卡举给他看，再在下面点同一个词。</p>${paperGrid('psel')}</div>` +
    (sel ? `<div class="place" style="--c:${COLOR[boxOf(sel)]};font-weight:400"><span class="pword" style="--c:${COLOR[boxOf(sel)]};font-size:34px">${esc(CAT[sel].text)}</span> ${S.peek ? sayBtn(sel) : '<button class="tag" data-act="peek">提示</button>'}${S.peek ? cardHint(CAT[sel]) : ''}</div>
      <div class="acts"><button class="btn bad" data-act="no">还不会</button><button class="btn good" data-act="yes">✓ 读对了</button></div>`
    : `<p class="note">${S.lastOk ? '刚读对一张，现在停也很好。' : '点一个词开始'}</p>`);
}
function exampleSentence(c) { if (c.kind === 'L') return `${c.kw}… 再说一个 ${c.snd} 开头的词`; return SENT[c.text] || c.sent || `说一句带 “${c.text}” 的话`; }
function sayTask(c) { return c.kind === 'L' ? `说出 2 个 <b>${esc(c.snd)}</b> 开头的词` : `用 <b>${esc(c.text)}</b> 说一句自己的话`; }
function drawReview() {
  if (S.paper && S.phase !== 'master') return drawReviewPaper();
  const id = curId(), c = CAT[id], b = boxOf(id);
  let body, acts;
  if (S.phase === 'card') {
    body = flashHTML(id, `<p class="parent">${BOXNAME[b]} · ${S.title}${S.peek ? '' : ' · <button class="tag" data-act="peek">提示</button>'}</p>${S.peek ? cardHint(c) + '<div class="row" style="justify-content:center">' + sayBtn(id) + '</div>' : ''}`);
    acts = `<div class="acts"><button class="btn bad" data-act="no">还不会</button><button class="btn good" data-act="yes">✓ 读对了</button></div>`;
  } else if (S.phase === 'redo') {
    body = flashHTML(id, `<p class="hint">你读：<b>${esc(c.text)}</b>，他跟读一遍。卡回 1 号盒，明天再见。</p>${cardHint(c)}<div class="row" style="justify-content:center">${sayBtn(id)}</div>`);
    acts = `<div class="acts one"><button class="btn primary" data-act="next">跟读了，下一张</button></div>`;
  } else if (S.phase === 'master') {
    const m = S.m;
    body = `${S.paper ? `<div class="pword" style="--c:var(--bm)">${esc(c.text)}</div>` : `<div class="flash sm" style="--c:var(--bm)">${esc(c.text)}</div>`}
      <p class="hint"><b>5 号盒读对了！</b>进「已掌握」还要过两关：</p>
      <div class="checks">
        <button class="check ${m.s ? 'on' : ''}" data-act="mk" data-k="s"><span class="bx">${m.s ? '✓' : ''}</span><span><b>说出来</b>　他自己${sayTask(c)}<br><span class="small">例：${esc(exampleSentence(c))}</span></span></button>
        <div class="row" style="justify-content:center">${sayBtn(id, 'sent')}</div>
        <button class="check ${m.u ? 'on' : ''}" data-act="mk" data-k="u"><span class="bx">${m.u ? '✓' : ''}</span><span><b>用出来</b>　在生活或书里自己用上、读出来过</span></button>
      </div>`;
    acts = `<div class="acts"><button class="btn" data-act="stay">还没有 → 留在 5 号盒</button><button class="btn good" data-act="master" ${m.s && m.u ? '' : 'disabled'}>都做到了 → ✓ 已掌握</button></div>`;
  }
  return top(`${S.i + 1} / ${S.ids.length}`, S.i / S.ids.length) + `<div class="big">${body}</div>` + acts + (S.phase === 'card' && S.i > 0 && S.lastOk ? `<p class="note">刚读对一张，现在停也很好。</p>` : '');
}
function reviewAnswer(ok) {
  const id = curId(), b = boxOf(id), t = dstr(today());
  if (!id) return;
  logDay('r');
  if (ok) {
    logDay('ok'); S.ok++;
    if (b === '5') { const s = st(id); S.m = { s: !!s.s, u: !!s.u }; S.phase = 'master'; return drawStage(); }
    const nb = b === 'm' ? 'm' : String(Math.min(5, (+b || 0) + 1));
    setCard(id, { b: nb, d: t });
    persist(); S.lastOk = true; return S.paper ? paperDone(id, nb) : nextCard();
  }
  S.bad++; S.lastOk = false;
  setCard(id, { b: '1', d: t }); persist();
  if (S.paper) return paperDone(id, '1', true);
  S.phase = 'redo'; drawStage();
}
function nextCard() { S.i++; S.phase = 'card'; S.peek = false; if (S.i >= S.ids.length) return finish(); drawStage(); }
function finish() {
  const r = S.mode === 'review' ? `读了 ${S.i} 张，读对 ${S.ok} 张。` : S.mode === 'sort' ? `分拣了 ${S.i} 张。` : '';
  const last = S.paper ? placeMsg() : '';
  $('#stage').innerHTML = `${last}<div class="big"><div class="flash sm" style="--c:var(--b4)">✓</div><p class="hint"><b>做完了！</b>${r}</p>
    ${S.mode === 'review' && S.bad ? '<p class="hint">读错的卡回到了 1 号盒，明天早上再见。</p>' : ''}</div>
    <div class="acts one"><button class="btn primary" data-act="close-stage">回到今天</button></div>`;
}

// sort
function startSort(ids) { S = { mode: 'sort', ids: shuffle(ids), i: 0, paper: PAPER, done: {}, sel: null, msg: null, orig: {} }; ids.forEach(id => S.orig[id] = 'q'); openStage(); drawStage(); }
function drawSort() {
  if (S.paper) { const n = S.ids.length, d = Object.keys(S.done).length;
    return top(`分拣 ${d} / ${n}`, d / n) + placeMsg() + `<div class="scroll"><p class="small">从待学袋里拿一张纸卡举给他看，在下面点同一个词，再按他读得怎么样。</p>${paperGrid('psel')}</div>` +
      (S.sel ? `<div class="place" style="--c:var(--bq);font-weight:400"><span class="pword" style="--c:var(--bq);font-size:34px">${esc(CAT[S.sel].text)}</span></div>
        <div class="acts" style="grid-template-columns:1fr 1fr 1fr"><button class="btn" data-act="s-q">不会 → 待学</button><button class="btn" style="background:var(--b2);color:#fff" data-act="s-2">读对但慢 → 2 号盒</button><button class="btn good" data-act="s-4">3 秒内读对 → 4 号盒</button></div>` : '<p class="note">点一个词开始</p>'); }
  const id = S.ids[S.i];
  return top(`分拣 ${S.i + 1} / ${S.ids.length}`, S.i / S.ids.length) +
    `<div class="big">${flashHTML(id, `<p class="parent">他会的直接进盒，不会的留在待学</p>`)}</div>
    <div class="acts" style="grid-template-columns:1fr 1fr 1fr"><button class="btn" data-act="s-q">不会 → 待学</button><button class="btn" style="background:var(--b2);color:#fff" data-act="s-2">读对但慢 → 2 号盒</button><button class="btn good" data-act="s-4">3 秒内读对 → 4 号盒</button></div>`;
}

// learn (sandwich)
function knownPool(kind) {
  const ok = id => ['3', '4', '5', 'm'].includes(boxOf(id));
  const all = Object.keys(state.cards).filter(id => CAT[id] && ok(id));
  const same = shuffle(all.filter(id => CAT[id].kind === kind)), other = shuffle(all.filter(id => CAT[id].kind !== kind));
  return same.concat(other).slice(0, 8);
}
function startLearn() { S = { mode: 'learn', step: 0, q: '' }; openStage(); drawStage(); }
function learnCandidates() {
  const wi = weekInfo(), toks = (wi.cur.home + ' ' + (wi.next ? wi.next.home : '')).toLowerCase().split(/[^a-z]+/).filter(Boolean);
  const inQ = id => boxOf(id) === 'q';
  const ids = Object.keys(CAT);
  const groups = [
    ['老师的词', ids.filter(id => inQ(id) && (CAT[id].src.includes('学校') || CAT[id].src.includes('新加')))],
    ['这周的字母音', ids.filter(id => inQ(id) && CAT[id].kind === 'L' && toks.includes(CAT[id].key))],
    ['这周的拼读词', ids.filter(id => inQ(id) && CAT[id].kind === 'W' && toks.some(t => CAT[id].fam && CAT[id].fam.replace('-', '') === t))],
    ['Dolch PP', ids.filter(id => inQ(id) && CAT[id].src.includes('PP'))],
  ];
  return groups.filter(g => g[1].length);
}
function drawLearn() {
  const steps = `<div class="steps">${[1, 2, 3, 4, 5].map(n => `<span class="${S.step >= n ? 'on' : ''}"></span>`).join('')}</div>`;
  const c1 = counts()['1'];
  if (S.step === 0) {
    const q = S.q.trim().toLowerCase();
    const found = q ? Object.keys(CAT).filter(id => boxOf(id) === 'q' && CAT[id].text.toLowerCase().startsWith(q)).slice(0, 24) : [];
    return `<div class="top"><button class="btn ghost" data-act="stop">取消</button><span class="small">选今天的新词</span></div>
      <div style="overflow:auto;flex:1;max-width:900px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px">
      ${c1 >= 10 ? `<div class="warn">1 号盒已经 ${c1} 张。规则是超过 10 张先不加新卡，今天多复习就好。</div>` : ''}
      <input id="lq" placeholder="搜索一个词" value="${esc(S.q)}" autocomplete="off" autocapitalize="off" spellcheck="false">
      ${q ? `<div class="pick">${found.map(id => `<button data-act="pickw" data-id="${esc(id)}">${esc(CAT[id].text)}</button>`).join('') || '<span class="small">待学里没有这个词，可以在「卡盒」里加</span>'}</div>` : ''}
      ${learnCandidates().map(([n, l]) => `<div><h2 style="margin-bottom:8px">${n}</h2><div class="pick">${l.slice(0, 18).map(id => `<button data-act="pickw" data-id="${esc(id)}">${esc(CAT[id].text)}</button>`).join('')}</div></div>`).join('')}
      </div>`;
  }
  const id = S.id, c = CAT[id];
  if (S.step === 'g') {
    const byBox = {}; S.known.forEach(k => (byBox[boxOf(k)] = byBox[boxOf(k)] || []).push(k));
    return `<div class="top"><button class="btn ghost" data-act="stop">停</button><span class="small">先拿出这些纸卡</span></div>
      <div class="scroll">
        <div class="panel"><h2>新词（在待学袋）</h2><div><span class="pword" style="--c:var(--bq)">${esc(c.text)}</span></div></div>
        <div class="panel"><h2>会的卡（夹在新词中间用，用完放回原来的盒子）</h2>
        ${Object.keys(byBox).sort((a, b) => BOXES.indexOf(a) - BOXES.indexOf(b)).map(b => `<div class="row"><span class="chip"><span class="dot" style="background:${COLOR[b]}"></span>${BOXNAME[b]}</span>${byBox[b].map(k => `<span class="wc" style="--c:${COLOR[b]}">${esc(CAT[k].text)}</span>`).join('')}</div>`).join('')}</div>
      </div>
      <div class="acts one"><button class="btn primary" data-act="l-gather">拿好了 →</button></div>`;
  }
  if (S.step === 1) return `<div class="top"><button class="btn ghost" data-act="stop">停</button>${steps}<span class="small">1 我读你跟</span></div>
    <div class="big">${flashHTML(id, `<p class="hint">你指着读一遍，他跟读。${c.kind === 'L' ? `说音 <b>${esc(c.snd)}</b>，${c.e} ${esc(c.kw)}` : c.mark === '拼' || c.kind === 'W' ? '能拼：一个音一个音拼，再连起来读。' : HEART[c.text] ? '❤ ' + esc(HEART[c.text]) : ''}</p><div class="row" style="justify-content:center">${sayBtn(id)}</div>`)}</div>
    <div class="acts one"><button class="btn primary" data-act="l-next">他跟读了 →</button></div>`;
  if (S.step === 2) {
    const cur = S.seq[S.k];
    return top(`2 夹心 · 第 ${S.seq.length ? S.round[S.k] : 0} 轮`, S.k / S.seq.length) +
      `<div class="big">${flashHTML(cur, S.stuck ? `<p class="hint">你说：<b>${esc(CAT[cur].text)}</b>，他跟读。</p><div class="row" style="justify-content:center">${sayBtn(cur)}</div>` : '')}</div>
      <div class="acts">${S.stuck ? '<button class="btn primary" data-act="l-go" style="grid-column:1/-1">跟读了 →</button>' : '<button class="btn bad" data-act="l-stuck">卡住了（超过 3 秒）</button><button class="btn good" data-act="l-go">✓ 读对了</button>'}</div>`;
  }
  if (S.step === 3) return `<div class="top"><button class="btn ghost" data-act="stop">停</button>${steps}<span class="small">3 说出来</span></div>
    <div class="big">${flashHTML(id, `<p class="hint">让他${sayTask(c)}。<br>说不出来你先说一句，他换一个东西再说。</p><p class="hint">例：${esc(exampleSentence(c))}</p><div class="row" style="justify-content:center">${sayBtn(id, 'sent')}</div>`)}</div>
    <div class="acts one"><button class="btn primary" data-act="l-next">他说了一句 →</button></div>`;
  if (S.step === 4) return `<div class="top"><button class="btn ghost" data-act="stop">停</button>${steps}<span class="small">4 用出来</span></div>
    <div class="big">${flashHTML(id, `<p class="hint">今天找机会用一次：<b>${esc(USE[c.text] || (c.kind === 'L' ? `找一个用 ${c.snd} 开头的东西` : `读书时找到 ${c.text}，让他指给你看`))}</b></p>`)}</div>
    <div class="acts one"><button class="btn primary" data-act="l-next">记住了 →</button></div>`;
  if (S.step === 5) {
    const d = state.daily[dstr(today())] || {};
    return `<div class="big">${PAPER ? `<div class="pword" style="--c:var(--b1)">${esc(c.text)}</div>` : `<div class="flash sm" style="--c:var(--b1)">${esc(c.text)}</div>`}<p class="hint"><b>${esc(c.text)}</b> 进了 1 号盒，明天早上复习。${PAPER ? '把这张纸卡放进 1 号盒，会的卡放回原来的盒子。' : ''}${S.stuckNew ? `夹心时新词卡住了 ${S.stuckNew} 次，明天多留意。` : ''}</p></div>
      <div class="acts ${(d.nw || 0) >= 2 || counts()['1'] >= 10 ? 'one' : ''}">${(d.nw || 0) >= 2 || counts()['1'] >= 10 ? '' : '<button class="btn" data-act="l-again">再学一个</button>'}<button class="btn primary" data-act="close-stage">结束（在读对时停）</button></div>`;
  }
}
function pickNew(id) {
  const known = knownPool(CAT[id].kind);
  if (known.length < 2) {
    $('#stage').innerHTML = `<div class="big"><p class="hint"><b>会的卡还太少。</b>夹心法要至少 2 张 3 号盒以上的卡。先去「卡盒 → 待学 → 分拣」，把他已经会的放进盒子。</p></div><div class="acts one"><button class="btn primary" data-act="close-stage">好</button></div>`;
    return;
  }
  const seq = [], round = [];
  for (let r = 1; r <= known.length; r++) { seq.push(id); round.push(r); for (let j = 0; j < r; j++) { seq.push(known[j]); round.push(r); } }
  Object.assign(S, { id, step: PAPER ? 'g' : 1, seq, round, k: 0, stuck: false, stuckNew: 0, known });
  drawStage();
}
function drawStage() {
  if (!S) return;
  $('#stage').innerHTML = S.mode === 'review' ? drawReview() : S.mode === 'sort' ? drawSort() : drawLearn();
  const lq = $('#lq');
  if (lq) { lq.addEventListener('input', () => { S.q = lq.value; const pos = lq.selectionStart; drawStage(); const n = $('#lq'); n.focus(); n.setSelectionRange(pos, pos); }); }
}

// ---------- actions ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id, b = el.dataset.b, t = dstr(today());
  switch (a) {
    case 'review': startReview(dueList(dueBoxes(today())), '今天'); break;
    case 'reviewbox': startReview(dueList([boxTab], true), '补复习'); break;
    case 'learn': startLearn(); break;
    case 'starter': DATA.school.forEach(x => { if (!state.cards['S:' + x.w]) setCard('S:' + x.w, { b: String(x.b) }); }); persist(); render(); break;
    case 'bk-copy': {
      const txt = JSON.stringify(state), ta = $('#bk'); ta.value = txt;
      const ok = () => { $('#bkmsg').textContent = '已复制。粘贴到备忘录或发给自己保存。'; };
      try { navigator.clipboard.writeText(txt).then(ok, () => { ta.focus(); ta.select(); $('#bkmsg').textContent = '没能自动复制：备份已选中，长按复制。'; }); } catch (er) { ta.focus(); ta.select(); }
      break;
    }
    case 'bk-load': {
      const raw = $('#bk').value.trim(); let obj = null;
      try { obj = JSON.parse(raw); } catch (er) {}
      if (!obj || typeof obj.cards !== 'object') { $('#bkmsg').textContent = '这段文字不是卡盒备份。先在另一台设备按「复制备份」，再整段粘贴过来。'; break; }
      if (el.dataset.sure !== '1') { el.dataset.sure = '1'; el.textContent = '确定：用备份替换这台设备上的记录'; $('#bkmsg').textContent = `备份里有 ${Object.keys(obj.cards).length} 张卡的记录、${(obj.timer || []).length} 条计时。再按一次确认。`; break; }
      state = normalize(obj); buildCatalog(); persist(); render(); break;
    }
    case 'gobox': view = 'boxes'; boxTab = b; render(); break;
    case 'tab': boxTab = b; render(); break;
    case 'card': openCard(id); break;
    case 'close': closeSheet(); break;
    case 'move': setCard(id, { b, d: t }); persist(); openCard(id); break;
    case 'lv': { const s = st(id), k = el.dataset.k; setCard(id, { [k]: !s[k] }); persist(); openCard(id); break; }
    case 'sort': startSort(Object.keys(CAT).filter(x => boxOf(x) === 'q' && CAT[x].src.includes(srcFilter))); break;
    case 'add': {
      const inp = $('#neww'), w = inp.value.trim().replace(/\s+/g, ' ');
      if (!w) { $('#addmsg').textContent = '先输入一个词。'; break; }
      let cid = 'S:' + w;
      if (!CAT[cid]) { state.custom.push({ id: cid, w }); buildCatalog(); }
      setCard(cid, { b, d: t }); persist();
      boxTab = b; render(); $('#addmsg').textContent = `${w} 放进了${BOXNAME[b]}。`; break;
    }
    case 'stop': S.mode === 'learn' ? closeStage() : finish(); break;
    case 'close-stage': closeStage(); break;
    case 'peek': S.peek = true; drawStage(); break;
    case 'psel': S.sel = id; S.peek = false; drawStage(); break;
    case 'paper': PAPER = !PAPER; try { localStorage.setItem(LKEY + ':paper', PAPER ? '1' : '0'); } catch (er) {} render(); break;
    case 'l-gather': S.step = 1; drawStage(); break;
    case 'say': { const c = CAT[id]; say(el.dataset.w === 'sent' ? exampleSentence(c) : c.kind === 'L' ? c.kw : c.text); break; }
    case 'yes': reviewAnswer(true); break;
    case 'no': reviewAnswer(false); break;
    case 'next': nextCard(); break;
    case 'mk': S.m[el.dataset.k] = !S.m[el.dataset.k]; drawStage(); break;
    case 'master': { const mid = curId(); setCard(mid, { b: 'm', s: true, u: true, d: t }); persist(); S.lastOk = true; S.paper ? paperDone(mid, 'm') : nextCard(); break; }
    case 'stay': { const mid = curId(); setCard(mid, { b: '5', d: t, s: S.m.s, u: S.m.u }); persist(); S.lastOk = true; S.paper ? paperDone(mid, '5') : nextCard(); break; }
    case 's-q': case 's-2': case 's-4': {
      const sid = curId(); if (!sid) break;
      const nb = a === 's-q' ? 'q' : a === 's-2' ? '2' : '4';
      if (nb !== 'q') { setCard(sid, { b: nb, d: t }); persist(); }
      if (S.paper) { paperDone(sid, nb); break; }
      S.i++; if (S.i >= S.ids.length) finish(); else drawStage(); break;
    }
    case 'pickw': pickNew(id); break;
    case 'l-next':
      if (S.step === 4) { setCard(S.id, { b: '1', d: t, t: true }); logDay('nw'); persist(); }
      S.step++; drawStage(); break;
    case 'l-stuck': S.stuck = true; if (S.seq[S.k] === S.id) S.stuckNew++; drawStage(); break;
    case 'l-go': S.stuck = false; S.k++; if (S.k >= S.seq.length) S.step = 3; drawStage(); break;
    case 'l-again': S = { mode: 'learn', step: 0, q: '' }; drawStage(); break;
    case 'tgo':
      if (tRun) { tElapsed += performance.now() - tStart; tRun = false; cancelAnimationFrame(tRAF); }
      else { tStart = performance.now(); tRun = true; lastSaved = null; }
      render(); break;
    case 'treset': tRun = false; tElapsed = 0; cancelAnimationFrame(tRAF); lastSaved = null; render(); break;
    case 'tsave': {
      const label = ($('#tlabel').value || '流利度表').trim(), sec = Math.round(curSec());
      const prev = state.timer.filter(r => r.label === label).map(r => r.sec), best = prev.length ? Math.min(...prev) : null;
      state.timer.push({ d: t, sec, label }); if (state.timer.length > 300) state.timer.shift(); persist();
      lastSaved = best == null ? `第一次记录：${fmt(sec)}` : sec < best ? `破纪录！比之前最好快了 ${best - sec} 秒 🎉` : `${fmt(sec)}，最好成绩是 ${fmt(best)}，明天再试`;
      tElapsed = 0; render(); break;
    }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'src') { srcFilter = e.target.value; render(); } });
document.addEventListener('keydown', e => {
  if (e.target.id === 'neww' && e.key === 'Enter') { e.preventDefault(); document.querySelector('[data-act="add"][data-b="1"]').click(); }
  if (e.key === 'Escape') { if (!$('#sheet').hidden) closeSheet(); }
});
render();
})();
</script>
